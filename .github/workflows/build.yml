name: build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_call:  # allows calling this workflow from other ones (such as the deploy)

jobs:
  resolve-java-versions:

    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      last: ${{ steps.set-matrix.outputs.last }}

    steps:
    - uses: actions/checkout@v7
    - id: set-matrix
      name: Read java versions from .sdkmanrc
      run: |
        versions=$(grep -E '^java=' .sdkmanrc | cut -d= -f2)
        echo "matrix=$(echo "$versions" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
        echo "last=$(echo "$versions" | tail -n1)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-java-versions

    runs-on: ubuntu-latest
    env:
      # The sample projects, which are built and checked using the plugin installed by the job
      SAMPLES: samples/sample samples/sample-lombok-dtogen
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJson(needs.resolve-java-versions.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v7
    - name: Write java-version file for ${{ matrix.java }}
      run: echo "java=${{ matrix.java }}" > "$RUNNER_TEMP/.sdkmanrc"
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version-file: '${{ runner.temp }}/.sdkmanrc'
        cache: maven

    - name: Build, test (with coverage check) and install the plugin
      run: mvn -B install --file java2ts/pom.xml

    - name: Build the sample projects (which generate their TypeScript and validation files)
      run: for sample in $SAMPLES; do mvn -B compile --file "$sample/pom.xml"; done

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: 'samples/*/frontend/package-lock.json'

    - name: Check the generated TypeScript files compile and the validation schemas work
      run: |
        for sample in $SAMPLES; do
          echo "Checking $sample"
          (cd "$sample/frontend" && npm ci && npm run check)
        done

    - name: Check the committed sample TypeScript files are up to date
      run: git diff --exit-code -- 'samples/*/frontend/*.generated.ts'

    - name: Codacy coverage report upload
      if: matrix.java == needs.resolve-java-versions.outputs.last
      env:
        CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      run: |
        test -z "$CODACY_PROJECT_TOKEN" || bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r java2ts/target/site/jacoco/jacoco.xml
